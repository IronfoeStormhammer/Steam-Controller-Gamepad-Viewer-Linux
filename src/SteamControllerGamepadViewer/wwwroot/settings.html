<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Steam Controller · Press Colors</title><style>
body{font:18px system-ui;background:#151922;color:#ecf1f8;max-width:1100px;margin:24px auto;padding:0 20px}h1{font-size:28px}a{color:#8bcfff}label{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px;background:#222a36;border-radius:8px}select,button{font:inherit;padding:10px;border-radius:6px}input[type=color]{width:70px;height:44px;border:0;background:none;cursor:pointer}#controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:16px}#controls[hidden]{display:none}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.preview{width:100%;height:540px;border:1px solid #3b475a;border-radius:10px;background:#101216}#status{min-height:28px}button{cursor:pointer}button[type=submit]{background:#2585c7;color:white;border:1px solid #67b8ed}small{color:#b5c1d2}</style></head><body>
<h1>Press Colors</h1><p>Choose one highlight color or set each control individually. Save applies to every open overlay, including OBS.</p>
<form id="settings"><label for="mode">Mode<select id="mode"><option value="global">Global color</option><option value="per-control">Per-control colors</option></select></label><br><label for="global">Global color / fallback<input id="global" type="color" value="#25a7ff"></label><div id="controls" hidden></div><div class="toolbar"><button type="submit">Save</button><button id="reset" type="button">Reset to defaults</button><a href="/" target="_blank">Open OBS overlay</a></div></form>
<p id="status" role="status" aria-live="polite">Loading…</p><h2>Live preview</h2><p><small>The preview uses real controller input. Unsaved changes appear here only.</small></p><iframe class="preview" id="preview" src="/" title="Controller color preview"></iframe><script src="/settings.js"></script></body></html>
