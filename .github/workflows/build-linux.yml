name: Linux build and release
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore SteamControllerGamepadViewer.sln
      - run: dotnet build SteamControllerGamepadViewer.sln -c Release --no-restore
      - run: dotnet test SteamControllerGamepadViewer.sln -c Release --no-build
      - run: dotnet publish src/SteamControllerGamepadViewer/SteamControllerGamepadViewer.csproj -c Release -r linux-x64 --self-contained true -o artifacts/publish-linux-x64
      - name: Package and checksum
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.2' }}
        run: ./scripts/package-linux.sh "${TAG#v}" artifacts/publish-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-release
          path: artifacts/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-x64-release
          path: release-assets-upload
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" release-assets-upload/* --verify-tag --title "Steam Controller Gamepad Viewer for Linux $TAG" --notes-file docs/release-notes-v2.0.2.md
          else
            echo "Release already exists; retaining its published assets."
          fi
